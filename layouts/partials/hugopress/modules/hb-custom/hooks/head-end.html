{{/* Put custom HTML markup before the end of <head>. */}}
{{- /* Fontes hospedadas no próprio site (static/fonts): sem requisição a terceiros e disponíveis offline no PWA. */ -}}
<link rel="preload" href="{{ "fonts/inter-latin-wght-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ "fonts/jetbrains-mono-latin-wght-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<style>
{{- $latin := "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD" }}
{{- $latinExt := "U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF" }}
{{- range slice (dict "family" "Inter" "file" "inter" "weight" "100 900") (dict "family" "JetBrains Mono" "file" "jetbrains-mono" "weight" "100 800") }}
@font-face{font-family:"{{ .family }}";font-style:normal;font-display:swap;font-weight:{{ .weight }};src:url("{{ printf "fonts/%s-latin-ext-wght-normal.woff2" .file | relURL }}") format("woff2-variations");unicode-range:{{ $latinExt }}}
@font-face{font-family:"{{ .family }}";font-style:normal;font-display:swap;font-weight:{{ .weight }};src:url("{{ printf "fonts/%s-latin-wght-normal.woff2" .file | relURL }}") format("woff2-variations");unicode-range:{{ $latin }}}
{{- end }}
</style>
